name: Verify game
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run engine:setup
      - run: npm run cards:check
      - run: npm run cards:catalog-check
      - run: npm test
        env:
          NODE_OPTIONS: --no-experimental-require-module
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run test:custom-ui
      - run: npm run test:motion-ui
      - run: npm run test:preview-ui
      - run: npm run test:ambush-hover-ui
